# Spring Profiles Active
spring.profiles.active=test

# Application
spring.application.name=backend-test
server.port=8081

# Database - use in-memory H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis - use embedded Redis or testcontainers for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# Cache Configuration
cache.enabled=true
cache.price.ttl=30
cache.candle.ttl=300

# Disable OAuth2 for tests
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-secret

# JWT for tests
jwt.secret=test-secret-key-for-testing-purposes-only
jwt.expiration=3600
jwt.refresh-expiration=86400

# API keys for tests
finnhub.api.key=test-key
crypto.api.key=test-key
metals.api.key=test-key

# Logging
logging.level.com.recognition=DEBUG
logging.level.org.springframework.data.redis=DEBUG
